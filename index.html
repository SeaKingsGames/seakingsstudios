<style>
/* Layout: cabecera con la marca y el ajolote, rejilla de cartas tipo lotería (una por proyecto), bitácora y contacto, todo en una columna de 1120px */
:root {
  --agua: #0a2129;
  --agua-2: #10303b;
  --linea: #23505c;
  --espuma: #e6f3ef;
  --niebla: #93b7b2;
  --ajolote: #ff8fb1;
  --menta: #7fe3c4;
  --sobre-acento: #0a2129;
  --sombra: #04141a;
  --velo: rgba(4, 20, 26, .72);

  /* Las cartas son "objetos de papel": mismos colores en tema claro y oscuro */
  --papel: #fffaf0;
  --tinta: #16222b;
  --tinta-suave: #4d5a60;
  --rojo: #e8506e;
  --corona: #ffd24d;
  --ok: #1d7f53;
  --prueba: #b06a00;
  --dev: #2662a8;
  --idea: #5f6670;

  --f-display: "Chango", "Arial Black", "Helvetica Neue", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --agua: #dceeea; --agua-2: #c9e5df; --linea: #8fbfb6; --espuma: #0d2a33; --niebla: #3d6266;
    --ajolote: #c43a6b; --menta: #13755e; --sobre-acento: #fffaf0; --sombra: #8fbab2; --velo: rgba(13, 42, 51, .55);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --agua: #dceeea; --agua-2: #c9e5df; --linea: #8fbfb6; --espuma: #0d2a33; --niebla: #3d6266;
  --ajolote: #c43a6b; --menta: #13755e; --sobre-acento: #fffaf0; --sombra: #8fbab2; --velo: rgba(13, 42, 51, .55);
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--agua);
  color: var(--espuma);
  font: 400 1rem/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
.marco { max-width: 1120px; margin-inline: auto; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--ajolote); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
p { margin: 0; }

/* ---------- Barra superior ---------- */
.barra {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 8px 20px; padding-block: 18px 6px;
}
.barra-marca { font: 1.05rem var(--f-display); letter-spacing: .02em; text-decoration: none; }
.barra nav { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.barra nav a {
  font: 500 .78rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em;
  color: var(--niebla); text-decoration: none; padding-block: 6px;
}
.barra nav a:hover { color: var(--espuma); }

/* ---------- Portada ---------- */
.portada {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
  gap: 24px 40px; padding-block: 44px 20px;
}
.portada-texto { display: grid; gap: 20px; min-width: 0; }
.ceja {
  font: 500 .78rem var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--menta);
}
.marca { font-family: var(--f-display); line-height: .88; font-size: clamp(2.5rem, 10.5vw, 7.2rem); letter-spacing: .01em; }
.marca span { display: block; }
.marca .m2 { color: transparent; -webkit-text-stroke: 2px var(--menta); letter-spacing: .06em; }
.entrada { max-width: 34rem; font-size: 1.12rem; color: var(--niebla); }
.acciones { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px;
  font: 700 .95rem var(--f-body); text-decoration: none; cursor: pointer; border: 2px solid transparent;
  transition: transform .15s ease;
}
.btn:hover { transform: translateY(-2px); }
.btn--principal { background: var(--ajolote); color: var(--sobre-acento); }
.btn--borde { border-color: var(--linea); color: var(--espuma); background: transparent; }
.cifras { display: flex; flex-wrap: wrap; gap: 10px 28px; padding-top: 6px; }
.cifra { display: flex; align-items: baseline; gap: 8px; }
.cifra b { font: 400 1.7rem var(--f-display); color: var(--espuma); font-variant-numeric: tabular-nums; }
.cifra span { font: 500 .78rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--niebla); }

.ajolote { width: clamp(170px, 26vw, 300px); height: auto; }
.ajolote .flota { animation: flota 4.5s ease-in-out infinite; transform-origin: 110px 100px; }
.ajolote .branquia { stroke: var(--ajolote); }
.ajolote .cuerpo { fill: var(--menta); }
@keyframes flota { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }

.ola { display: block; width: 100%; height: 22px; margin-block: 8px 0; overflow: hidden; }
.ola path { fill: none; stroke: var(--linea); stroke-width: 2.5; }
.ola .ola-mov { animation: ola 3s linear infinite; }
@keyframes ola { to { transform: translateX(-100px); } }

/* ---------- Secciones ---------- */
.seccion { padding-block: 56px 8px; display: grid; gap: 24px; }
.seccion-cab { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 24px; }
.seccion-cab > div { display: grid; gap: 6px; }
.seccion h2 { font: 400 clamp(1.9rem, 5vw, 2.7rem)/1 var(--f-display); }

.filtros { display: flex; flex-wrap: wrap; gap: 8px; }
.filtro {
  font: 500 .8rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em;
  padding: 7px 12px; border-radius: 999px; border: 2px solid var(--linea);
  background: transparent; color: var(--niebla); cursor: pointer; display: inline-flex; gap: 8px; align-items: center;
}
.filtro b { font-weight: 500; color: var(--espuma); font-variant-numeric: tabular-nums; }
.filtro[aria-pressed="true"] { background: var(--espuma); border-color: var(--espuma); color: var(--agua); }
.filtro[aria-pressed="true"] b { color: var(--agua); }

/* ---------- Cartas de proyecto (estilo lotería) ---------- */
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; }
.carta {
  display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 14px;
  background: var(--papel); color: var(--tinta); text-decoration: none;
  border: 3px solid var(--tinta); border-radius: 12px; box-shadow: 7px 7px 0 var(--sombra);
  transition: transform .2s ease, box-shadow .2s ease;
}
.carta:hover { transform: rotate(-1.4deg) translateY(-4px); box-shadow: 10px 11px 0 var(--sombra); }
.carta:nth-child(even):hover { transform: rotate(1.4deg) translateY(-4px); }
.carta-top { display: flex; justify-content: space-between; gap: 8px; font: 500 .75rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; }
.carta-top span:first-child { border: 2px solid var(--tinta); border-radius: 4px; padding: 1px 6px; }
.carta-top span:last-child { color: var(--tinta-suave); align-self: center; }

.arte {
  position: relative; aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; overflow: hidden;
  border: 2.5px solid var(--tinta); border-radius: 6px; color: var(--tinta);
  background: radial-gradient(circle at 1px 1px, rgba(22, 34, 43, .16) 1.3px, transparent 1.6px) 0 0 / 11px 11px, var(--c);
}
.arte svg { width: 74%; height: auto; }
.arte img { width: 100%; height: 100%; object-fit: cover; }
.arte .monograma { font: 400 3rem var(--f-display); }
.i-papel { fill: var(--papel); }
.i-tinta { fill: currentColor; }
.i-rojo { fill: var(--rojo); }

.carta-nombre { font: 400 1.45rem/1.05 var(--f-display); text-transform: uppercase; text-align: center; letter-spacing: .02em; }
.carta-lema { text-align: center; color: var(--tinta-suave); font-size: .95rem; line-height: 1.45; flex: 1; }
.carta-pie { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 2px dashed rgba(22, 34, 43, .25); }
.ver { font-weight: 700; font-size: .9rem; white-space: nowrap; }

.estado {
  display: inline-flex; align-items: center; gap: 7px; width: fit-content;
  font: 500 .7rem var(--f-mono); text-transform: uppercase; letter-spacing: .07em;
  padding: 4px 9px; border: 1.5px solid currentColor; border-radius: 999px;
}
.estado i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.estado--ok { color: var(--ok); }
.estado--prueba { color: var(--prueba); }
.estado--dev { color: var(--dev); }
.estado--idea { color: var(--idea); }

/* ---------- Ficha (detalle de proyecto) ---------- */
dialog#ficha {
  padding: 0; border: 3px solid var(--tinta); border-radius: 14px;
  background: var(--papel); color: var(--tinta);
  width: min(680px, calc(100% - 32px)); max-height: calc(100% - 40px);
  box-shadow: 10px 10px 0 var(--sombra);
}
dialog#ficha::backdrop { background: var(--velo); }
.ficha { display: grid; gap: 18px; padding: 18px 20px 24px; }
.ficha-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 .78rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; }
.cerrar {
  width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--tinta); background: var(--papel); color: var(--tinta);
  font: 700 1.3rem/1 var(--f-body); cursor: pointer; display: grid; place-items: center;
}
.cerrar:hover { background: var(--tinta); color: var(--papel); }
.arte--grande { aspect-ratio: 16 / 7; }
.arte--grande svg { width: 42%; }
.ficha h2 { font: 400 clamp(1.8rem, 6vw, 2.5rem)/1 var(--f-display); text-transform: uppercase; }
.ficha-desc { font-size: 1.05rem; line-height: 1.6; max-width: 62ch; }
.ficha-bloques { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px 24px; }
.ficha-bloque { display: grid; gap: 8px; align-content: start; min-width: 0; }
.ficha-bloque h3 { font: 500 .74rem var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--tinta-suave); }
.ficha-bloque ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.ficha-bloque li { padding-left: 18px; position: relative; line-height: 1.45; }
.ficha-bloque li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--tinta)); border: 1.5px solid var(--tinta); }
.pastillas { display: flex; flex-wrap: wrap; gap: 6px; }
.pastilla { font: 500 .76rem var(--f-mono); padding: 4px 8px; border: 1.5px solid var(--tinta); border-radius: 6px; }
.pendiente { color: var(--tinta-suave); font-size: .92rem; }
.enlaces { display: flex; flex-wrap: wrap; gap: 10px; }
.boton-tinta {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 10px;
  background: var(--tinta); color: var(--papel); font-weight: 700; text-decoration: none;
}
.boton-tinta:hover { background: var(--rojo); color: var(--papel); }

/* ---------- Bitácora ---------- */
.bitacora { list-style: none; margin: 0; padding: 0; display: grid; border-top: 2px solid var(--linea); }
.bitacora li {
  display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) auto; gap: 6px 20px; align-items: baseline;
  padding-block: 16px; border-bottom: 2px solid var(--linea);
}
.bitacora time { font: 500 .85rem var(--f-mono); color: var(--menta); font-variant-numeric: tabular-nums; text-transform: uppercase; letter-spacing: .04em; }
.bitacora p { min-width: 0; }
.etiqueta {
  font: 500 .74rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--niebla);
  text-decoration: none; border: 1.5px solid var(--linea); border-radius: 999px; padding: 3px 10px; white-space: nowrap;
}
.etiqueta:hover { color: var(--espuma); border-color: var(--niebla); }

/* ---------- Contacto ---------- */
.contacto { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.caja { background: var(--agua-2); border-radius: 14px; padding: 22px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.caja h3 { font: 500 .78rem var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--niebla); }
.correo { font: 500 clamp(1rem, 3.6vw, 1.25rem) var(--f-mono); overflow-wrap: anywhere; user-select: all; }
.copiar-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.aviso { font-size: .88rem; color: var(--menta); min-height: 1.4em; }
.redes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.redes li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; padding-bottom: 10px; border-bottom: 1.5px solid var(--linea); }
.redes .red { white-space: nowrap; }
.redes li:last-child { border-bottom: 0; padding-bottom: 0; }
.redes .red { font-weight: 700; font-size: 1.05rem; }
.redes .usuario { font: 500 .85rem var(--f-mono); color: var(--niebla); }
.redes .seg { white-space: nowrap; }
.redes .seg { font: 500 .85rem var(--f-mono); color: var(--niebla); font-variant-numeric: tabular-nums; }

.pie a { color: var(--niebla); }
.pie a:hover { color: var(--espuma); }
.pie {
  margin-top: 56px; padding-block: 22px 32px; border-top: 2px solid var(--linea);
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px;
  font: 500 .76rem var(--f-mono); color: var(--niebla); text-transform: uppercase; letter-spacing: .06em;
}

@media (max-width: 720px) {
  .portada { grid-template-columns: minmax(0, 1fr); padding-block: 28px 12px; }
  .ajolote { width: 150px; justify-self: end; margin-top: -8px; }
  .bitacora li { grid-template-columns: minmax(0, 1fr); }
  .bitacora .etiqueta { justify-self: start; }
  .marca .m2 { -webkit-text-stroke-width: 1.5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<script>
/* ---- 1. Datos del estudio ---- */
const ESTUDIO = {
  nombre: "SeaKingsStudios",
  ceja: "Estudio independiente · México",
  entrada: "Juegos para reírte con tus amigos y herramientas para animar tus propios personajes. Esto es lo que tenemos en marcha.",
  lineaDeJuegos: "SeaKingsGames",
  correo: "seakingsgames@gmail.com",
  // Pon el enlace de tu perfil en "url" y el nombre se vuelve un enlace.
  // "seguidores" es opcional: si lo dejas vacío no se muestra.
  redes: [
    { red: "TikTok",   usuario: "@litoelajolote",   seguidores: "45 mil", url: "https://www.tiktok.com/@litoelajolote" },

<!-- ================================================================
     MOTOR DE LA PÁGINA (no necesitas tocarlo para agregar proyectos)
     ================================================================ -->
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const PALABRAS_CORTAS = ["o", "y", "de", "del", "la", "el", "los", "las", "en"];

  const estadoDe = (p) => ESTADOS[p.estado] || ESTADOS.desarrollo;
  const numero = (i) => "Nº " + String(i + 1).padStart(2, "0");
  const iniciales = (nombre) => nombre.split(/\s+/).filter((w) => w && !PALABRAS_CORTAS.includes(w.toLowerCase())).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
  const fecha = (iso) => { const [a, m, d] = iso.split("-").map(Number); return `${d} ${MESES[m - 1]} ${a}`; };

  function chipEstado(p) {
    const e = estadoDe(p);
    return `<span class="estado estado--${e.clase}"><i aria-hidden="true"></i>${esc(e.texto)}</span>`;
  }

  function arte(p, grande) {
    let dentro;
    if (p.portada) dentro = `<img src="${esc(p.portada)}" alt="">`;
    else if (ICONOS[p.icono]) dentro = ICONOS[p.icono];
    else dentro = `<span class="monograma">${esc(iniciales(p.nombre))}</span>`;
    return `<div class="arte${grande ? " arte--grande" : ""}" style="--c:${esc(p.color || "#7fe3c4")}">${dentro}</div>`;
  }

  /* --- Portada --- */
  $("#ceja").textContent = ESTUDIO.ceja;
  $("#entrada").textContent = ESTUDIO.entrada;
  const conteo = {};
  PROYECTOS.forEach((p) => { const k = ESTADOS[p.estado] ? p.estado : "desarrollo"; conteo[k] = (conteo[k] || 0) + 1; });
  const cifras = [`<div class="cifra"><b>${PROYECTOS.length}</b><span>${PROYECTOS.length === 1 ? "proyecto" : "proyectos"}</span></div>`];
  Object.keys(ESTADOS).forEach((k) => {
    if (conteo[k]) cifras.push(`<div class="cifra"><b>${conteo[k]}</b><span>${esc(ESTADOS[k].resumen(conteo[k]))}</span></div>`);
  });
  $("#cifras").innerHTML = cifras.join("");

  let d = "M0 11 Q25 1 50 11";
  for (let x = 100; x <= 1400; x += 50) d += ` T${x} 11`;
  $("#ola-path").setAttribute("d", d);

  /* --- Cartas y filtros --- */
  let filtro = "";
  const tipos = [...new Set(PROYECTOS.map((p) => p.tipo).filter(Boolean))];

  function pintarFiltros() {
    if (tipos.length < 2) { $("#filtros").hidden = true; return; }
    const op = [["", "Todos", PROYECTOS.length], ...tipos.map((t) => [t, t, PROYECTOS.filter((p) => p.tipo === t).length])];
    $("#filtros").innerHTML = op.map(([v, txt, n]) =>
      `<button type="button" class="filtro" data-tipo="${esc(v)}" aria-pressed="${v === filtro}">${esc(txt)} <b>${n}</b></button>`).join("");
  }

  function pintarCartas() {
    $("#rejilla").innerHTML = PROYECTOS.map((p, i) => {
      if (filtro && p.tipo !== filtro) return "";
      return `<a class="carta" href="#${esc(p.id)}" data-id="${esc(p.id)}">
        <div class="carta-top"><span>${numero(i)}</span><span>${esc(p.tipo)}</span></div>
        ${arte(p)}
        <h3 class="carta-nombre">${esc(p.nombre)}</h3>
        <p class="carta-lema">${esc(p.lema)}</p>
        <div class="carta-pie">${chipEstado(p)}<span class="ver">Ver ficha →</span></div>
      </a>`;
    }).join("");
  }

  $("#filtros").addEventListener("click", (e) => {
    const b = e.target.closest(".filtro");
    if (!b) return;
    filtro = b.dataset.tipo;
    pintarFiltros();
    pintarCartas();
  });

  /* --- Ficha --- */
  const dlg = $("#ficha");
  function lista(arr, comoPastillas) {
    if (!arr || !arr.length) return `<p class="pendiente">Por anunciar</p>`;
    if (comoPastillas) return `<div class="pastillas">${arr.map((t) => `<span class="pastilla">${esc(t)}</span>`).join("")}</div>`;
    return `<ul>${arr.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`;
  }

  function abrir(id, cambiarEnlace) {
    const i = PROYECTOS.findIndex((p) => p.id === id);
    if (i < 0) return;
    const p = PROYECTOS[i];
    const enlaces = (p.enlaces || []).filter((l) => l && l.url);
    $("#ficha-cont").style.setProperty("--c", p.color || "#7fe3c4");
    $("#ficha-cont").innerHTML = `
      <div class="ficha-top"><span>${numero(i)} · ${esc(p.tipo)}</span>
        <button class="cerrar" type="button" aria-label="Cerrar ficha" data-cerrar>×</button></div>
      ${arte(p, true)}
      <div style="display:grid;gap:10px">
        <h2 id="ficha-nombre">${esc(p.nombre)}</h2>
        ${chipEstado(p)}
      </div>
      <p class="ficha-desc">${esc(p.descripcion)}</p>
      <div class="ficha-bloques">
        <div class="ficha-bloque"><h3>Qué tiene</h3>${lista(p.caracteristicas)}</div>
        <div class="ficha-bloque" style="gap:16px">
          <div class="ficha-bloque"><h3>Plataformas</h3>${lista(p.plataformas, true)}</div>
          <div class="ficha-bloque"><h3>Hecho con</h3>${lista(p.tecnologias, true)}</div>
        </div>
      </div>
      ${enlaces.length
        ? `<div class="enlaces">${enlaces.map((l) => `<a class="boton-tinta" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.texto || "Abrir")} ↗</a>`).join("")}</div>`
        : `<p class="pendiente">Todavía no hay enlace público.</p>`}`;
    if (!dlg.open) dlg.showModal();
    dlg.scrollTop = 0;
    if (cambiarEnlace) { try { history.replaceState(null, "", "#" + p.id); } catch (e) {} }
  }

  dlg.addEventListener("click", (e) => {
    if (e.target === dlg || e.target.closest("[data-cerrar]")) dlg.close();
  });
  dlg.addEventListener("close", () => {
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  });

  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-id]");
    if (!a) return;
    e.preventDefault();
    abrir(a.dataset.id, true);
  });

  /* --- Bitácora --- */
  const porId = Object.fromEntries(PROYECTOS.map((p) => [p.id, p]));
  $("#lista-bitacora").innerHTML = [...NOVEDADES]
    .sort((a, b) => b.fecha.localeCompare(a.fecha))
    .map((n) => {
      const p = n.proyecto && porId[n.proyecto];
      return `<li><time datetime="${esc(n.fecha)}">${esc(fecha(n.fecha))}</time><p>${esc(n.texto)}</p>${p ? `<a class="etiqueta" href="#${esc(p.id)}" data-id="${esc(p.id)}">${esc(p.nombre)}</a>` : "<span></span>"}</li>`;
    }).join("");

  /* --- Contacto --- */
  $("#correo").textContent = ESTUDIO.correo;
  $("#copiar").addEventListener("click", () => {
    const aviso = $("#aviso");
    const seleccionar = () => {
      const r = document.createRange();
      r.selectNodeContents($("#correo"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      aviso.textContent = "Correo seleccionado. Cópialo con tu teclado o mantén presionado.";
    };
    try {
      navigator.clipboard.writeText(ESTUDIO.correo).then(() => { aviso.textContent = "Correo copiado."; }, seleccionar);
    } catch (e) { seleccionar(); }
  });
  $("#redes").innerHTML = ESTUDIO.redes.map((r) => {
    const texto = esc(r.red) + (r.usuario ? ` <span class="usuario">${esc(r.usuario)}</span>` : "");
    const nombre = r.url ? `<a class="red" href="${esc(r.url)}" target="_blank" rel="noopener">${texto} ↗</a>` : `<span class="red">${texto}</span>`;
    return `<li>${nombre}${r.seguidores ? `<span class="seg">${esc(r.seguidores)} seguidores</span>` : ""}</li>`;
  }).join("");

  $("#pie-izq").textContent = `© ${new Date().getFullYear()} ${ESTUDIO.nombre}`;
  $("#pie-der").textContent = `${ESTUDIO.lineaDeJuegos} es nuestra línea de juegos`;

  pintarFiltros();
  pintarCartas();

  /* Abre la ficha si la página llega con #id-del-proyecto */
  const h = decodeURIComponent(location.hash.slice(1));
  if (porId[h]) abrir(h, false);
})();
</script>
